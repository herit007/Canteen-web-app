<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Center card */
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 0;
        }

        .container {
            width: 90%;
            max-width: 800px;
        }

        .card {
            background-color: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        input[type="number"] {
            width: 70px;
            text-align: center;
            padding: 5px;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links a {
            margin: 0 10px;
            text-decoration: none;
            color: #007BFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Today's Menu</h2>

            <form id="orderForm" action="{{ url_for('order') }}" method="POST">
                <table>
                <tr>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Quantity</th>
                </tr>
                {% for item in items %}
                <tr>
                    <td>{{ item.item_name }}</td>
                    <td>₹{{ item.price }}</td>
                    <td>
                    <input type="number" name="quantity_{{ item.item_id }}" min="0" value="0">
                    </td>
                </tr>
                {% endfor %}
                </table>
                <button type="submit">Place Order</button>
            </form>

            <div class="links">
                <a href="{{ url_for('orders') }}">View My Orders</a> |
                <a href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('orderForm');
        form.addEventListener('submit', function(e) {
        // Get all number inputs
        const quantities = Array.from(form.querySelectorAll('input[type="number"]'));
        // Sum all quantities
        const total = quantities.reduce((sum, input) => sum + parseInt(input.value || 0), 0);

        if (total === 0) {
            e.preventDefault(); // prevent form submission
            alert("⚠️ Please select 1 or more items to order!");
        }
        });
    </script>
</body>
</html>
